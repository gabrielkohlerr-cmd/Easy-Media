<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 175" role="img" aria-label="Totali Garage — Serviços Automotivos">
  <defs>
    <linearGradient id="totaliSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6d6b3" />
      <stop offset="100%" stop-color="#b9b9b2" />
    </linearGradient>
    <linearGradient id="garageGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8892e" />
      <stop offset="100%" stop-color="#f0d491" />
    </linearGradient>
  </defs>

  <path d="M 40 100 Q 260 6 480 100" fill="none" stroke="#c9a227" stroke-width="4" stroke-linecap="round" />

  <text x="10" y="128" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900"
        font-size="60" letter-spacing="1" fill="url(#totaliSilver)">TOTALI</text>
  <text x="248" y="128" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900"
        font-size="60" letter-spacing="1" fill="url(#garageGold)">GARAGE</text>

  <text x="260" y="161" text-anchor="middle" font-size="18" letter-spacing="2">
    <tspan font-family="Georgia, 'Times New Roman', serif" font-weight="400" fill="#f2ece0">Serviços </tspan><tspan font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#f2ece0">Automotivos</tspan>
  </text>
</svg>
